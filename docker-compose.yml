# Run Onrecord on your own computer. Nothing here touches any cloud account.
#   docker compose up --build
# Then open http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: onrecord
      POSTGRES_PASSWORD: onrecord
      POSTGRES_DB: onrecord
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onrecord"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://onrecord:onrecord@db:5432/onrecord
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://onrecord:onrecord@db:5432/onrecord
      PORT: "8000"
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
